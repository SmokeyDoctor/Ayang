<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Our Little Birthday Adventure</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 30%,#4a3a8a,#1c1530);font-family:"Courier New",ui-monospace,monospace;color:#4a2f55}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;overflow:hidden;background:#000;font-size:10px;touch-action:none}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}
button{font-family:inherit;cursor:pointer}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:.8em;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:5}
.pbox{background:#2b2150;border:.25em solid #9b7be0;box-shadow:0 0 0 .2em #1a1236;color:#fff}
#hearts{padding:.35em .6em;font-size:1.6em;letter-spacing:.08em;display:inline-block}
.h{color:#ff4f87}.h.off{color:#4a3f78}
#count{margin-top:.7em;display:flex;align-items:center;gap:.5em;padding:.3em .7em;font-size:1.35em;font-weight:700;color:#ffd24a;width:fit-content}
#count canvas{width:1.7em;image-rendering:pixelated}
.btns{display:flex;gap:.5em;pointer-events:auto}
.hb{width:3em;height:3em;background:#2b2150;border:.25em solid #9b7be0;color:#fff;font-size:1.3em;font-weight:700;line-height:1;padding:0}
.hb:active{background:#4a3a8a}
/* controls */
#controls{position:absolute;left:0;right:0;bottom:0;padding:1em;display:flex;justify-content:space-between;align-items:flex-end;z-index:5;pointer-events:none}
.cg{display:flex;gap:.8em;pointer-events:auto}
.cb{width:4.6em;height:4.6em;background:rgba(185,162,240,.72);border:.25em solid #7a5fc4;color:#2b2150;font-size:2.2em;font-weight:700;line-height:1;padding:0;touch-action:none;box-shadow:0 .2em 0 #5a43a0}
.cb.act{background:rgba(224,85,138,.85);color:#fff;border-color:#a02f60;box-shadow:0 .2em 0 #7a1f47}
.cb.small{width:3.6em;height:3.6em;font-size:1.8em;align-self:flex-end;margin-bottom:.3em}
.cb.pulse{animation:pl .6s infinite alternate;background:rgba(255,210,74,.92);border-color:#c9951a;color:#4a2f55}
@keyframes pl{to{transform:scale(1.12)}}
.cb:active{transform:translateY(.15em);box-shadow:none}
/* moci dialog */
#moci{position:absolute;left:.8em;right:.8em;top:7.2em;display:none;z-index:6;padding:.7em;gap:.8em;align-items:flex-start;background:rgba(45,34,80,.95);border:.25em solid #9b7be0;color:#e9defc;font-size:1.2em;line-height:1.35;pointer-events:none}
#moci canvas{flex:none;width:3em;height:3em;image-rendering:pixelated;background:#fff;border:.15em solid #9b7be0}
#moci b{color:#ff9fc6;display:block;font-size:.85em;letter-spacing:.1em}
/* modal */
#modal{position:absolute;inset:0;background:rgba(30,20,60,.5);display:none;align-items:center;justify-content:center;z-index:10;padding:1.4em}
.card{position:relative;width:100%;max-height:92%;overflow:auto;background:#fdf6ee;border:.35em solid #c9a8f0;box-shadow:0 0 0 .25em #7a5fc4,0 1em 2em rgba(0,0,0,.35);padding:2em 1.4em 1.4em;text-align:center;color:#4a2f55;font-size:1.2em;line-height:1.4}
.ribbon{display:block;width:fit-content;margin:-.9em auto .7em;background:#e0558a;color:#fff;padding:.3em 1.4em;font-size:.75em;font-weight:700;letter-spacing:.15em;border:.2em solid #a02f60;white-space:nowrap}
.x{position:absolute;top:.4em;right:.4em;width:2em;height:2em;background:#e8dcf5;border:.15em solid #9b7be0;color:#4a2f55;font-weight:700;padding:0}
.ttl{font-weight:700;font-size:1.05em;margin:.2em 0 .6em}
.paper{background:#fffdf8;border:.15em solid #ddd0bf;padding:.9em;text-align:left;font-size:.85em;line-height:1.6;max-height:24em;overflow:auto}
.paper p{margin:0 0 .8em}.paper p:last-child{margin:0}
.pbtn{display:inline-block;margin-top:1em;background:#e0558a;color:#fff;border:.2em solid #a02f60;box-shadow:0 .3em 0 #a02f60;padding:.6em 1.2em;font-weight:700;letter-spacing:.06em;font-size:.9em;text-decoration:none}
.pbtn:active{transform:translateY(.2em);box-shadow:0 .1em 0 #a02f60}
.pbtn.dis{background:#c7b8d4;border-color:#9a8aa8;box-shadow:0 .3em 0 #9a8aa8;pointer-events:none}
.pbtn.alt{background:#7a5fc4;border-color:#4a3a8a;box-shadow:0 .3em 0 #4a3a8a}
.env{font-size:3.4em;line-height:1.2}
.seal{width:3.4em;height:3.4em;border-radius:50%;background:#e0558a;border:.2em solid #a02f60;color:#fff;font-size:1.6em;margin:.4em 0;animation:pl .7s infinite alternate;padding:0}
.hint{font-size:.7em;opacity:.7}
.polaroid{background:#fff;padding:.7em .7em 2em;border:.1em solid #e5dccd;box-shadow:0 .3em .8em rgba(0,0,0,.2);transform:rotate(-1.5deg);display:block;width:86%;margin:0 auto}
.polaroid canvas{display:block;width:100%;height:20em;object-fit:cover;background:#eee}
.polaroid img{display:block;width:100%!important;max-width:none;height:20em;object-fit:cover;image-rendering:auto;background:#eee}
.cap{margin-top:.8em;font-size:.85em}
.vid{width:100%;background:#1a1236;border:.2em solid #7a5fc4;aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;color:#c9a8f0;font-size:.85em;padding:1em}
audio{width:100%;margin-top:.6em}
.sp{display:flex;align-items:center;gap:.6em;margin:.8em 0 .2em;background:#f1e8fa;border:.15em solid #c9a8f0;padding:.5em}
.spb{flex:none;width:2.4em;height:2.4em;background:#e0558a;border:.15em solid #a02f60;color:#fff;font-size:1em;padding:0}
.spbar{flex:1;height:.8em;background:#fff;border:.15em solid #9b7be0;cursor:pointer}
.spbar i{display:block;height:100%;width:0;background:#e0558a}
#sptime{flex:none;font-size:.7em;min-width:6.5em;text-align:right}
video{width:100%;max-height:22em;background:#000;border:.2em solid #7a5fc4}
.cass{font-size:3em;color:#e0558a}
.note{font-size:.8em;opacity:.8}
.item{display:block;width:100%;text-align:left;background:#fff;border:.15em solid #c9a8f0;padding:.7em;margin:.5em 0;font-size:.8em;color:#4a2f55;line-height:1.45}
.item.lock{background:#f1e8fa;text-align:center;font-weight:700;color:#7a5fc4}
.item.done{background:#fff7fb;border-color:#e0558a}
.stars{font-size:.85em;margin-top:.6em;color:#c9951a;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em;margin:.7em 0}
.gi{background:#fff;border:.15em solid #c9a8f0;padding:.5em .2em;font-size:.7em;min-height:5em;color:#4a2f55;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.3em}
.gi.l{background:#ece2f8;color:#a08cc8}
.gi img,.gi canvas{width:100%;height:3.2em;object-fit:cover;background:#eee}
.gi .ic{font-size:2em;line-height:1}
.bar{height:1em;background:#e8dcf5;border:.15em solid #9b7be0;margin:.4em 0}
.bar i{display:block;height:100%;background:#e0558a}
/* screens */
.scr{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;padding:1.4em}
#start .card{padding-top:1.6em;border-color:#e6b6d6;max-width:30em}
.logo{font-weight:900;color:#e0558a;text-shadow:.08em .08em 0 #7a1f47,-.05em -.05em 0 #ffd24a;line-height:1.05}
.logo small{display:block;font-size:.7em;color:#7a5fc4;text-shadow:none;letter-spacing:.2em}
.logo big{display:block;font-size:2em;letter-spacing:.04em}
.outs{display:flex;gap:.6em;justify-content:center;margin:.6em 0}
.out{flex:1;background:#e9dcf8;border:.2em solid #d8c8ec;padding:.4em .2em;font-size:.7em;color:#4a2f55;display:flex;flex-direction:column;align-items:center;gap:.3em}
.out.sel{border-color:#e0558a;background:#fff0f6;box-shadow:0 0 0 .15em #e0558a}
.out canvas{width:2.6em;image-rendering:pixelated}
#end{background:#14123a;flex-direction:column;overflow:auto;text-align:center;color:#fff;justify-content:flex-start;padding-top:3em}
#end h1{font-size:3.4em;margin:.2em 0;letter-spacing:.12em;color:#fff;text-shadow:.06em .06em 0 #e0558a}
#end .sub{font-size:1.2em;color:#ffb3d1;margin:.3em 0 .8em}
#end .frame{background:#fffdf8;padding:.6em .6em 1.4em;border:.25em solid #ffd24a;width:88%;max-width:26em;color:#4a2f55;font-size:1.1em}
#end .frame canvas{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;object-position:center 72%;background:#eee}
#end .frame img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;object-position:center 72%}
.stat{margin:.9em auto;padding:.5em .9em;background:#3a2e7a;border:.2em solid #ffd24a;color:#ffd24a;font-weight:700;font-size:1.05em;width:88%;max-width:28em}
.erow{display:flex;gap:.6em;justify-content:center;width:88%;max-width:28em;margin:.3em auto}
.erow .pbtn{flex:1;margin:0;font-size:.95em;padding:.6em .3em}
.conf{position:absolute;top:-2em;width:.7em;height:.7em;z-index:9;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv" width="180" height="320"></canvas>
  <div id="hud">
    <div><div id="hearts" class="pbox"></div><div id="count" class="pbox"><canvas id="cico" width="14" height="12"></canvas><span id="cnum">0/0</span></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako_inflate.min.js"></script>
<script>
(()=>{
/* ====================================================================

   {her} = nama panggilan dia, {me} = nama panggilan kamu, {moci} = nama maskot
   ==================================================================== */
const CONFIG={
  her:"Ayang",
  me:"pacar kamu",
  moci:"Mochi",
  title:["OUR LITTLE","BIRTHDAY","ADVENTURE"],
  /* Karakter dia: jilbab hitam, baju panjang (warna dari outfit), rok. */
  char:{hijab:"#1c1920",hijabLight:"#36313d",skin:"#f4c7a1"},
  /* Karakter kamu: kemeja putih, celana hitam. Loncat-loncat nunggu di dekat kue, lalu ikut jalan di belakang dia. */
  meChar:{hair:"#15110f",skin:"#e2a77c",shirt:"#fbfbfb",shirtDark:"#cfd3dd",pants:"#1f1f26",lens:"#cfe4f5"},
  outfits:[
    {name:"Bandung",color:"#2b2733",dark:"#141218",skirt:"#f6f3f0",skirtDark:"#d6cfd9"},
    {name:"Hiking",color:"#3d3a46",dark:"#25222c",skirt:"#4a4652",skirtDark:"#34313b"},
    {name:"Lavender",color:"#a07fd8",dark:"#7656b0",skirt:"#f6f3f0",skirtDark:"#d6cfd9"}
  ],
  mociStart:"Halo {her}! Ada surat dari {me} di peti pertama. Dekati petinya, lalu tekan E.",
  mociFall:"Gapapa, kita coba sekali lagi, ya!",
  mociRefill:"{moci} kasih hati baru. Semangat!",
  mociAllDone:"Semua harta di sini udah kamu temuin. Lanjut ke kanan, ya!",
  mociMeet:"Eh, {me} ketemu kamu! Sekarang dia ikut jalan bareng kamu, ya.",
  mociCake:"Ada kue ulang tahun! Deketin kuenya, terus tekan E buat tiup lilin.",
  mociGate:"Masih ada harta yang belum kamu buka. Balik dulu yuk!",
  mociTriggers:[
    {x:5,text:"Halo, aku {moci}! Itu capybara, temen aku. Dia santai banget, jangan diganggu, ya."},

    {type:"letter",x:14,row:15,sealed:true,ribbon:"SURAT PERTAMA",title:"Buat {her}, tempatku pulang",
      body:[
        "Happy birthday, {her}! Hari ini aku bikin dunia kecil ini cuma buat kamu, tempat semua hal yang aku suka dari kamu bisa dikumpulin satu-satu.",
        "Makasih udah jadi orang paling sabar dan sayang ke aku, yang udah jadi alasan aku untuk tetep berjuang setiap hari.",
        "Cari peti-peti lainnya, ya. Masih banyak kejutan di depan. — {me}"
      ]},
    {type:"photo",x:30,row:15,src:"assets/foto1.jpg",caption:"Gunung pertama kita, di Garut ⛰"},
    {type:"photo",x:39,row:15,src:"assets/foto2.jpg",caption:"Pantai pertama kita 🌊"},

      items:[

        "Semoga kita bisa bertahan sampai selamanya."

/* ==================== batas bagian yang diedit ==================== */

const T=s=>(s||"").replace(/\{her\}/g,CONFIG.her).replace(/\{me\}/g,CONFIG.me).replace(/\{moci\}/g,CONFIG.moci);
const $=id=>document.getElementById(id);
const W=180,H=320,TS=16,GY=15,GROUND=GY*TS;
const stage=$("stage"),cv=$("cv"),ctx=cv.getContext("2d");ctx.imageSmoothingEnabled=false;

/* ---------- layout ---------- */
function fit(){const iw=innerWidth,ih=innerHeight;let w=Math.min(iw,ih*9/16),h=w*16/9;if(h>ih){h=ih;w=h*9/16}
  stage.style.width=w+"px";stage.style.height=h+"px";stage.style.fontSize=(w/36)+"px"}
addEventListener("resize",fit);fit();

/* ---------- helpers ---------- */
const lerp=(a,b,t)=>a+(b-a)*t;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(a,b){let h=Math.imul(a*374761393+b*668265263,1274126177);h^=h>>>13;return((h>>>0)%1000)/1000}
function mk(rows,pal){const h=rows.length,w=rows[0].length,c=document.createElement("canvas");c.width=w;c.height=h;const g=c.getContext("2d");
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const ch=rows[y][x];if(ch!=="."&&pal[ch]){g.fillStyle=pal[ch];g.fillRect(x,y,1,1)}}return c}
function disc(g,cx,cy,r){for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r)g.fillRect(cx+x,cy+y,1,1)}

/* ---------- sprites ---------- */

const CHEST=["..dddddddddd..",".dbbbbbbbbbbd.","dbbbbbbbbbbbbd","dBBBBBBBBBBBBd","dggggggggggggd","dbbbbbggbbbbbd","dbbbbbggbbbbbd","dbbbbbbbbbbbbd","dbbbbbbbbbbbbd","dBBBBBBBBBBBBd","dBBBBBBBBBBBBd",".dddddddddddd."];
const HEART=[".rr.rr.","rrrrrrr","rrrrrrr",".rrrrr.","..rrr..","...r..."];
const CPAL={d:"#3a2018",b:"#b4682f",B:"#8a4a22",g:"#ffd24a"};

/* ---------- physics ---------- */
const SPEED=1.8,JV=6.5,G=.34;
function update(){const p=player;
  const ax=(keys.r?1:0)-(keys.l?1:0);
  p.vx+=(ax*SPEED-p.vx)*.4;if(ax)p.face=ax;
  p.coyote=p.onGround?6:p.coyote-1;p.buf--;
  if(p.buf>0&&p.coyote>0){p.vy=-JV;p.buf=0;p.coyote=0;p.onGround=false;sfx.jump()}
  if(!keys.j&&p.vy<-3.6)p.vy=-3.6;
  const prevBottom=p.y+p.h;
  p.x+=p.vx;p.x=Math.max(0,Math.min(WORLD-p.w,p.x));
  p.vy=Math.min(7,p.vy+G);p.y+=p.vy;p.onGround=false;
  if(p.vy>=0){for(const s of surfaces){
    if(p.x+p.w>s.x1+1&&p.x<s.x2-1&&prevBottom<=s.y+.01&&p.y+p.h>=s.y){p.y=s.y-p.h;p.vy=0;p.onGround=true;
      if(p.x>s.x1+10&&p.x+p.w<s.x2-10)lastSafe={x:p.x,y:p.y};break}}}
  p.anim=(p.onGround&&Math.abs(p.vx)>.4)?p.anim+.2:0;
  if(invul>0)invul--;
  if(p.y>H+24){hearts--;sfx.hurt();
    if(hearts<=0){hearts=5;say(CONFIG.mociRefill,4200)}else say(CONFIG.mociFall,3800);
    updHud();p.x=lastSafe.x;p.y=lastSafe.y;p.vx=0;p.vy=0;invul=60;trail=[];if(boy.follow){boy.x=p.x-p.face*14;boy.y=p.y}}
  CONFIG.mociTriggers.forEach((t,i)=>{if(!fired[i]&&p.x>t.x*TS){fired[i]=1;say(t.text)}});
  if(p.x+p.w/2>ARCH-10&&gateCd<=0){
    if(collected>=chests.length)endGame();
    else{say(CONFIG.mociGate,4500);p.x=ARCH-70;p.vx=0;gateCd=120;trail=[];if(boy.follow){boy.x=p.x-14;boy.y=p.y}}}
  if(gateCd>0)gateCd--;
  const near=nearChest();$("bE").classList.toggle("pulse",!!near||(nearCake()&&!cakeBlown));
  if(!fired.cake&&p.x>CAKEX-90){fired.cake=1;if(!cakeBlown)say(CONFIG.mociCake,5000)}
  updBoy(p);
}
/* cowok: loncat-loncat nunggu, lalu ikut jalan di belakang cewek */
function updBoy(p){const b=boy;
  if(!b.follow){b.hop=b.hop>0?b.hop-1:0;
    if(b.y>=GROUND-20&&b.vy>=0&&Math.random()<.025){b.vy=-3.2}
    b.vy+=G;b.y+=b.vy;if(b.y>=GROUND-20){b.y=GROUND-20;b.vy=0}
    b.face=p.x<b.x?-1:1;
    if(Math.abs(p.x-b.x)<14&&Math.abs(p.y-(GROUND-20))<8){b.follow=true;trail=[];say(CONFIG.mociMeet,4500);sfx.chest()}
    return}
  trail.push({x:p.x,y:p.y,g:p.onGround});if(trail.length>200)trail.shift();
  const back=Math.abs(p.vx)>.4||!p.onGround?16:0;const tg=trail[Math.max(0,trail.length-1-back)];
  const dx=tg.x-p.face*14-b.x;
  b.anim=Math.abs(dx)>.5?b.anim+.2:0;if(Math.abs(dx)>.3)b.face=dx>0?1:-1;else b.face=p.face;
  b.x+=Math.max(-2.2,Math.min(2.2,dx));
  if(tg.g){b.y+=((tg.y)-b.y)*.35;b.air=Math.abs(tg.y-b.y)>2}else{b.y+=(tg.y-b.y)*.35;b.air=true}
  if(!p.onGround)b.air=true;
  if(Math.abs(b.x-p.x)>120){b.x=p.x-p.face*14;b.y=p.y}}

function makeBike(){const c=document.createElement("canvas");c.width=36;c.height=20;const g=c.getContext("2d");
  const line=(x0,y0,x1,y1,col)=>{g.fillStyle=col;const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0));for(let i=0;i<=n;i++)g.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1)};
  const wheel=(cx,cy)=>{g.fillStyle="#141418";disc(g,cx,cy,5);g.fillStyle="#b9bec6";disc(g,cx,cy,4);g.fillStyle="#26262c";disc(g,cx,cy,3);
    line(cx-3,cy,cx+3,cy,"#8c929a");line(cx,cy-3,cx,cy+3,"#8c929a");line(cx-2,cy-2,cx+2,cy+2,"#6c727a");line(cx-2,cy+2,cx+2,cy-2,"#6c727a");g.fillStyle="#e4e7eb";g.fillRect(cx,cy,1,1)};
  wheel(7,14);wheel(28,14);
  line(7,14,10,4,"#c8ccd2");line(8,14,11,4,"#8c929a");
  line(11,8,26,8,"#1c1c22");line(26,8,28,14,"#1c1c22");line(14,13,28,14,"#1c1c22");line(25,6,32,12,"#1c1c22");
  g.fillStyle="#5c6068";g.fillRect(13,9,8,5);g.fillStyle="#8a8e96";for(let x=13;x<21;x+=2)g.fillRect(x,9,1,4);g.fillStyle="#3a3c42";g.fillRect(13,13,8,1);
  line(19,13,33,11,"#d6d9de");line(20,14,33,12,"#7a7e86");
  g.fillStyle="#a01820";g.fillRect(12,8,8,1);
  g.fillStyle="#d8262f";g.fillRect(12,4,6,1);g.fillRect(11,5,9,3);g.fillStyle="#ff6b6b";g.fillRect(12,5,4,1);g.fillStyle="#fff";g.fillRect(17,5,1,3);
  g.fillStyle="#5a3220";g.fillRect(20,6,7,2);g.fillStyle="#7a4a30";g.fillRect(20,6,6,1);
  g.fillStyle="#d8262f";g.fillRect(27,4,3,3);g.fillRect(26,5,1,2);g.fillStyle="#a01820";g.fillRect(27,6,3,1);
  g.fillStyle="#1c1c22";g.fillRect(8,4,4,1);g.fillRect(8,5,1,1);
  g.fillStyle="#c8ccd2";disc(g,6,6,2);g.fillStyle="#fff4c0";g.fillRect(5,5,2,2);
  g.fillStyle="#ff3a3a";g.fillRect(31,6,1,1);return c}
const sprBike=makeBike(),BIKEX=CAKEX+46;
function drawBike(cam,t){const x=BIKEX-cam;if(x<-40||x>W+10)return;ctx.globalAlpha=.25+.08*Math.sin(t*.004);ctx.fillStyle="#fff1b0";
  ctx.beginPath();ctx.moveTo(x+5,GROUND-14);ctx.lineTo(x-26,GROUND-20);ctx.lineTo(x-26,GROUND-6);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle="rgba(20,6,24,.35)";ctx.fillRect(x+2,GROUND-1,32,2);ctx.drawImage(sprBike,x|0,GROUND-20)}
function drawCake(x,t){const y=GROUND;ctx.fillStyle="#fff";ctx.fillRect(x-1,y-2,18,2);
  ctx.fillStyle="#ffd1e4";ctx.fillRect(x,y-8,16,6);ctx.fillStyle="#ff8fbd";ctx.fillRect(x,y-8,16,2);ctx.fillStyle="#fff";ctx.fillRect(x+2,y-5,2,1);ctx.fillRect(x+8,y-5,2,1);ctx.fillRect(x+12,y-5,2,1);
  ctx.fillStyle="#ffd1e4";ctx.fillRect(x+3,y-13,10,5);ctx.fillStyle="#ff8fbd";ctx.fillRect(x+3,y-13,10,2);
  ctx.fillStyle="#7ec8ff";ctx.fillRect(x+7,y-17,2,4);if(cakeBlown){ctx.globalAlpha=.5;ctx.fillStyle="#ddd";const k=(t>>6)%10;ctx.fillRect(x+7+(k>5?1:0),y-20-k,1,2);ctx.globalAlpha=1;return}
  ctx.fillStyle=(t>>7)%2?"#ffd24a":"#ff9f4a";ctx.fillRect(x+7,y-20,2,3);ctx.globalAlpha=.25;ctx.fillStyle="#ffe6a0";ctx.beginPath();ctx.arc(x+8,y-18,7,0,7);ctx.fill();ctx.globalAlpha=1;
  if(state==="play"&&nearCake()&&!modalOpen){ctx.fillStyle="#2b2150";ctx.fillRect(x+3,y-38,10,10);ctx.fillStyle="#ffd24a";ctx.font="bold 8px monospace";ctx.textAlign="center";ctx.fillText("E",x+8,y-30)}}
function drawArch(cam,t){const cx=ARCH-cam,top=GROUND-46;
  const glow=.22+Math.sin(t*.003)*.06+(collected>=chests.length?.2:0);
  ctx.globalAlpha=glow;ctx.fillStyle="#fff";ctx.fillRect(cx-16,top-14,32,60);ctx.globalAlpha=1;
  ctx.fillStyle="#f5e6f0";ctx.fillRect(cx-19,top,4,46);ctx.fillRect(cx+15,top,4,46);
  for(let a=0;a<=24;a++){const ang=Math.PI*(1-a/24);const x=cx+Math.cos(ang)*17,y=top-Math.sin(ang)*17;ctx.fillStyle=a%3===0?"#ff8fbd":"#f5e6f0";ctx.fillRect(x-1.5|0,y-1.5|0,4,4)}
  ctx.fillStyle="#6ccf5f";for(let i=0;i<8;i++){ctx.fillRect(cx-19,top+i*6,1,3);ctx.fillRect(cx+18,top+3+i*6,1,3)}
  ctx.fillStyle="#ff4f87";ctx.fillRect(cx-1,top-19,3,3)}
function drawChest(c,cam,t){const x=c.px-cam,y=c.py;
  if(!c.opened){ctx.drawImage(sprChest,x|0,y-12);
    const bob=Math.sin(t*.005+c.px)*1.5;ctx.drawImage(sprHeart,(x+3.5)|0,(y-21+bob)|0);
    if((t>>8)%3===0){ctx.fillStyle="#fff";ctx.fillRect(x-2,y-14,1,1);ctx.fillRect(x+15,y-9,1,1)}}
  else{c.t++;ctx.drawImage(sprChest,0,4,14,8,x|0,y-8,14,8);ctx.fillStyle="#3b2447";ctx.fillRect(x+1,y-8,12,2);
    ctx.drawImage(sprChest,0,0,14,4,x|0,y-15,14,4);
    ctx.globalAlpha=.4;ctx.fillStyle="#fff1b0";ctx.fillRect(x+3,y-26,8,12);ctx.globalAlpha=.18;ctx.fillRect(x+1,y-32,12,18);ctx.globalAlpha=1}}
function render(t){
  const cam=state==="menu"?((t*.012)%(WORLD-W)|0):Math.max(0,Math.min(WORLD-W,Math.round(player.x-70)));
  ctx.clearRect(0,0,W,H);ctx.drawImage(sky,0,0);
  drawBackdrop(cam,t);
  const cl=[[20,40,0],[90,58,1],[140,30,2],[60,80,3],[200,20,0],[260,66,2]];
  cl.forEach((c,i)=>{const w=clouds[c[2]].width;const x=((c[0]-cam*.2-t*.004*(1+i%3))%360+360)%360-60;ctx.drawImage(clouds[c[2]],x|0,c[1]+40)});
  drawMountains(cam,t);
  for(let i=0;i<26;i++){const x=(((i*37+t*.01*(1+i%3)-cam*.3)%220)+220)%220-10,y=226+(i*13)%90;if(y<GROUND){ctx.fillStyle="rgba(255,200,170,.3)";ctx.fillRect(x|0,y,3+(i%3)*2,1)}}
  decorTrees.forEach(([tx,k])=>{const im=smallTrees[k],x=tx*TS-cam-im.width/2;if(x>-60&&x<W+10)ctx.drawImage(im,x|0,GROUND-im.height+3)});
  lamps.forEach(l=>{const x=l*TS-cam;if(x>-10&&x<W+10)drawLamp(x,t)});
  {const x=TREEX-cam-bigTree.width/2;if(x>-140&&x<W+10){ctx.drawImage(bigTree,x|0,GROUND-bigTree.height+3);
    const sx=TREEX-cam-48;ctx.fillStyle="#5b3a29";ctx.fillRect(sx+8,GROUND-12,2,12);ctx.fillRect(sx+30,GROUND-12,2,12);ctx.fillStyle="#b07a4a";ctx.fillRect(sx,GROUND-26,40,14);ctx.fillStyle="#d9a066";ctx.fillRect(sx,GROUND-26,40,2);ctx.fillStyle="#fff";ctx.font="bold 5px monospace";ctx.textAlign="center";ctx.fillText("HAPPY",sx+20,GROUND-19);ctx.fillText("BIRTHDAY ♥",sx+20,GROUND-14)}}
  drawBike(cam,t);
  if(CAKEX-cam>-20&&CAKEX-cam<W+10)drawCake(CAKEX-cam,t);
  if(ARCH-cam>-40&&ARCH-cam<W+40)drawArch(cam,t);
  // moci in world
  if(boy&&state!=="menu"){const b=boy,x=Math.round(b.x-cam-2),y=Math.round(b.y);if(x>-20&&x<W+20){
    const air=b.follow?b.air:b.y<GROUND-21;const img=air?meSpr.jump:(b.anim>0?((b.anim|0)%2?meSpr.walkA:meSpr.walkB):meSpr.idle);
    ctx.save();if(b.face<0){ctx.translate(x+12,y);ctx.scale(-1,1);ctx.drawImage(img,0,0)}else ctx.drawImage(img,x,y);ctx.restore();
    if(!b.follow&&(t>>9)%2)ctx.drawImage(sprHeart,x+2,y-10)}}
  CONFIG.capys.forEach((c,i)=>{const x=c.x*TS-cam;if(x<-20||x>W+4)return;const br=((t*.003+i)|0)%2,im=c.orange?sprCapyO:c.sleep?sprCapyZ:sprCapy;
    ctx.drawImage(im,x|0,GROUND-11+(c.sleep?br:0));
    if(c.sleep){ctx.fillStyle="#fff";ctx.font="bold 6px monospace";ctx.textAlign="left";const z=(t*.02%12)|0;ctx.globalAlpha=1-z/12;ctx.fillText("z",x+4+z/3,GROUND-14-z);ctx.globalAlpha=1}
    else if(player&&state!=="menu"&&Math.abs(player.x-(c.x*TS+8))<22){ctx.drawImage(sprHeart,(x+5)|0,GROUND-20-((t>>8)%2))}});
  [[8*TS,GROUND],[CAKEX-24,GROUND]].forEach(([mx,my],i)=>{const x=mx-cam;if(x>-20&&x<W+20){const b=Math.abs(Math.sin(t*.004+i*2))*3|0;ctx.drawImage(sprMoci,x|0,my-12-b)}});
  // platforms
  plats.forEach(p=>{const x=p.x*TS-cam,w=p.w*TS;if(x>-w&&x<W){ctx.fillStyle="#6d4630";ctx.fillRect(x,p.r*TS+3,w,3);ctx.fillStyle="#b07a4a";ctx.fillRect(x,p.r*TS,w,4);ctx.fillStyle="#d9a066";ctx.fillRect(x,p.r*TS,w,1);
    ctx.fillStyle="#6ccf5f";for(let k=0;k<w;k+=5)ctx.fillRect(x+k,p.r*TS-1,2,1);ctx.fillStyle="#ff7fb0";ctx.fillRect(x+3,p.r*TS-2,1,1);ctx.fillRect(x+w-5,p.r*TS-2,1,1)}});
  // ground
  segs.forEach(s=>{const c0=Math.max(s[0],Math.floor(cam/TS)),c1=Math.min(s[1]-1,Math.floor((cam+W)/TS));for(let c=c0;c<=c1;c++)drawGroundTile(c,cam);
    const lx=s[0]*TS-cam,rx=s[1]*TS-cam;ctx.fillStyle="rgba(20,6,24,.45)";ctx.fillRect(lx,GROUND+5,2,H);ctx.fillRect(rx-2,GROUND+5,2,H);ctx.fillStyle="#3d9147";ctx.fillRect(lx-1,GROUND+1,1,4);ctx.fillRect(rx,GROUND+1,1,4)});
  if(chests)chests.forEach(c=>{const x=c.px-cam;if(x>-20&&x<W+10)drawChest(c,cam,t)});
  // player
  if(state!=="menu"&&player){const p=player,sp=playerSprites(outfit);
    const img=!p.onGround?sp.jump:(Math.abs(p.vx)>.4?((p.anim|0)%2?sp.walkA:sp.walkB):sp.idle);
    if(!(invul>0&&(t>>6)%2)){ctx.save();const px=Math.round(p.x-cam-2),py=Math.round(p.y);
      if(p.face<0){ctx.translate(px+12,py);ctx.scale(-1,1);ctx.drawImage(img,0,0)}else ctx.drawImage(img,px,py);ctx.restore()}
    const near=nearChest();if(near){const x=near.px-cam+7,y=near.py-(near.opened?36:30);ctx.fillStyle="#2b2150";ctx.fillRect(x-5,y-8,10,10);ctx.fillStyle="#ffd24a";ctx.font="bold 8px monospace";ctx.textAlign="center";ctx.fillText("E",x,y)}}
  // petals
  petals.forEach(q=>{q.x+=q.vx;q.y+=q.vy;if(q.y>H){q.y=-2;q.x=Math.random()*W*1.3}if(q.x<-2)q.x=W+2;ctx.fillStyle="#ffb7d5";ctx.fillRect(q.x|0,q.y|0,q.s,q.s)});
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;
function frame(t){const dt=Math.min(100,t-last);last=t;
  if(state==="play"&&!paused&&!modalOpen){acc+=dt;while(acc>=16.667){update();acc-=16.667}playTime+=dt/1000}else acc=0;
  render(t);requestAnimationFrame(frame)}
resetGame();showStart();requestAnimationFrame(frame);
if(/[?&]debug\b/.test(location.search))window.__dbg={get state(){return state},get player(){return player},get chests(){return chests},interact,endGame,startGame};
})();
